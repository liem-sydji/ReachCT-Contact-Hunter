[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reachct-mcp"
version = "0.1.0"
description = "ReachCT Model Context Protocol server — scrape, table outreach data, and manage personal databases via HTTP API only."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27.0",
]

[project.scripts]
reachct-mcp = "reachct_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
